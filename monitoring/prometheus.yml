global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: verifier
    metrics_path: /metrics/
    static_configs:
      - targets: [verifier:8000]
  - job_name: llm-stub
    metrics_path: /metrics/
    static_configs:
      - targets: [llm-stub:8000]
  - job_name: workers
    dns_sd_configs:
      - names: [agent-worker]
        type: A
        port: 9101
        refresh_interval: 5s
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: jaeger
    static_configs:
      - targets: [jaeger:14269]
