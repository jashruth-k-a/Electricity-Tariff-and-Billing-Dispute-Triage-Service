[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-triage"
version = "0.1.0"
description = "Evidence-grounded electricity dispute triage with independently deployed agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "redis>=5.2,<7", "rq>=2.2,<3",
  "langgraph>=1.0,<2", "langchain-core>=1.0,<2", "langchain-text-splitters>=1.0,<2",
  "chromadb>=1.0,<2", "pypdf>=5,<7", "prometheus-client>=0.21,<1", "jsonschema>=4.26,<5",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4,<6"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "locust>=2.33,<3"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
